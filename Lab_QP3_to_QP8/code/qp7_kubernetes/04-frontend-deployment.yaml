apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: visual-analytics
  labels:
    app: frontend-web
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
        tier: ui
    spec:
      containers:
        - name: nginx-web
          image: 26mml0045/visual-analytics-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-web
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: visual-analytics
  labels:
    app: frontend-web
spec:
  type: NodePort
  selector:
    app: frontend-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
      name: http-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-deployment
  namespace: visual-analytics
  labels:
    app: streamlit-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-dashboard
  template:
    metadata:
      labels:
        app: streamlit-dashboard
    spec:
      containers:
        - name: streamlit
          image: 26mml0045/visual-analytics-streamlit:1.0
          ports:
            - containerPort: 8501
              name: http-streamlit
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: visual-analytics
spec:
  type: NodePort
  selector:
    app: streamlit-dashboard
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30851
      name: http-streamlit
